<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_1 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_1');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.querySelector('#gear-container') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xDE822B, 2); // Golden Bear highlight
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Create a Spur Gear geometry using basic primitives
const gearGroup = new THREE.Group();

// Core cylinder
const coreGeom = new THREE.CylinderGeometry(1, 1, 0.8, 32);
const material = new THREE.MeshStandardMaterial({ 
    color: 0xB76308, // Tenne
    metalness: 0.8, 
    roughness: 0.3 
});
const core = new THREE.Mesh(coreGeom, material);
core.rotation.x = Math.PI / 2;
gearGroup.add(core);

// Teeth
const toothCount = 20;
const toothGeom = new THREE.BoxGeometry(0.3, 0.3, 0.8);
for (let i = 0; i < toothCount; i++) {
    const angle = (i / toothCount) * Math.PI * 2;
    const tooth = new THREE.Mesh(toothGeom, material);
    tooth.position.set(Math.cos(angle) * 1.1, Math.sin(angle) * 1.1, 0);
    tooth.rotation.z = angle;
    gearGroup.add(tooth);
}

// Inner bore hole
const boreGeom = new THREE.CylinderGeometry(0.3, 0.3, 0.9, 32);
const boreMat = new THREE.MeshBasicMaterial({ color: 0x6A2B08 }); // Redwood
const bore = new THREE.Mesh(boreGeom, boreMat);
bore.rotation.x = Math.PI / 2;
gearGroup.add(bore);

scene.add(gearGroup);

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
});

function animate() {
    requestAnimationFrame(animate);
    
    gearGroup.rotation.z += 0.005;
    gearGroup.rotation.y = mouseX * 0.5;
    gearGroup.rotation.x = mouseY * 0.5 + Math.PI / 2;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>
</html>
